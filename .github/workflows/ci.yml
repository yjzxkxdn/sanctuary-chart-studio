name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 构建与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      # winit / glutin 编译期需要 X11 与 Wayland 头文件，cpal 需要 ALSA。
      - name: 安装 Linux 图形与音频依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev pkg-config

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --all

      - name: 构建
        run: cargo build --release

      # 该自检在创建窗口之前返回，不需要 GPU / X11，可在任何 CI 运行器上执行。
      - name: 无界面自检（生成 → 校验 → 导出）
        shell: bash
        run: |
          BIN=./target/release/sanctuary-chart-studio
          [ "$RUNNER_OS" = "Windows" ] && BIN="${BIN}.exe"
          SCS_EXPORT=demo.json "$BIN"
          test -s demo.json && echo "导出成功：$(wc -c < demo.json) 字节"
