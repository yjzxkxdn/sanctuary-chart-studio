name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 打包 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 图形与音频依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev pkg-config

      - name: 编译
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp "target/${{ matrix.target }}/release/sanctuary-chart-studio${{ matrix.ext }}" out/
          cp README.md LICENSE out/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "sanctuary-chart-studio-${{ matrix.target }}.zip" ./out/* > /dev/null
          else
            (cd out && zip -r "../sanctuary-chart-studio-${{ matrix.target }}.zip" .)
          fi
          ls -lh "sanctuary-chart-studio-${{ matrix.target }}.zip"

      - name: 上传产物
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sanctuary-chart-studio-${{ matrix.target }}.zip
          generate_release_notes: true
